{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 450px; margin: auto;">
    <h2 class="text-center">Resident Login</h2>
    <form method="POST" action="/login">
        Email: <input type="email" name="email" class="form-control" required><br>
        Password: <input type="password" name="password" class="form-control" required><br>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="text-center mt-3"><a href="/register">New? Register here</a></p>
</div>
{% endblock %}
