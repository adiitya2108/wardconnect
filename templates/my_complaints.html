<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>My Complaints</title>
</head>
<body>
					<h1>My Complaints</h1>
						<table border="1">
							<tr>
								<th>Complaint ID</th>
								<th>Title</th>
								<th>Category</th>
								<th>Status</th>
								<th>Date</th>
							</tr>
							{% for c in complaints %}
								<tr>
									 <td>{{ c[0] }}</td>
									 <td>{{ c[1] }}</td>
									 <td>{{ c[2] }}</td>
									 <td>{{ c[3] }}</td>
									 <td>{{ c[4] }}</td>
								</tr>
								{% endfor %}
							</table>

							<p><a href="/"> Back to Home </a></p>
</body>
</html>
