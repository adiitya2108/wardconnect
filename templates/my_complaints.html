{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>My Complaints</h2>
    <table class="table table-striped">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Category</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        {% for c in complaints %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td><span class="status-badge">{{ c[3] }}</span></td>
            <td><a href="/feedback/{{ c[0] }}" class="btn btn-primary btn-sm">Feedback</a></td>
        </tr>
        {% endfor %}
    </table>
    <a href="/complaint" class="btn btn-primary">Post New Complaint</a>
</div>
{% endblock %}
