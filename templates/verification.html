{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2 class="text-center">Submit Verification</h2>
    <form method="POST" action="/verification" enctype="multipart/form-data">
        Full Name: <input type="text" name="full_name" class="form-control" required><br>
        Aadhar Number: <input type="text" name="aadhar" class="form-control" required><br>
        Ward ID: <input type="text" name="ward_id" class="form-control" placeholder="W05" required><br>
        Address: <input type="text" name="address" class="form-control"><br>
        Document Type:
        <select name="document_type" class="form-control">
            <option value="Aadhar Card">Aadhar Card</option>
            <option value="Voter ID">Voter ID</option>
            <option value="Ration Card">Ration Card</option>
        </select><br>
           Upload Document Photo: <input type="file" name="document_photo" class="form-control" accept="image/*"><br>
        <button type="submit" class="btn btn-primary w-100">Submit Verification</button>
    </form>
</div>
{% endblock %}
