 <!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Submit Verification (WardConnect)</title>
</head>
<body>
			<h1>Submit Verification Documents</h1>

			<form  method="POST" action="/verification" enctype="multipart/form-data">
				
				Doc Type :
				<select name="doc_type">
					<option value="Voter ID">Voter ID</option>
					<option value="Aadhaar">Aadhaar</option>
					<option value="Electricity Bill">Electricity Bill</option>
					<option value="Rent Agreement">Rent Agreement</option>
					<option value="College ID">College ID</option>

				</select> <br> <br>

				Doc Number : <input type="text" name="doc_number" required><br> <br>
				Doc Photo : <input type="file" name="doc_photo" required><br> <br>

				<button type="submit">Submit For Verification</button>

				
			</form>

					<p><a href="/">Back To Home</p>

</body>
</html>
