{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 600px; margin: auto;">
    <h2 class="text-center">Post Complaint</h2>
    <form method="POST" action="/complaint" enctype="multipart/form-data">
        Title: <input type="text" name="title" class="form-control" required><br>
        Category:
        <select name="category" class="form-control">
            <option value="Road">Road</option>
            <option value="Water">Water</option>
            <option value="Garbage">Garbage</option>
            <option value="Street Light">Street Light</option>
            <option value="Drainage">Drainage</option>
            <option value="Other">Other</option>
        </select><br>
        Description: <textarea name="description" class="form-control" rows="4" required></textarea><br>
        Ward ID: <input type="text" name="ward_id" class="form-control" placeholder="W05" required><br>
        Location: <input type="text" name="location" class="form-control"><br>
        Photo of Problem: <input type="file" name="photo" class="form-control" accept="image/*"><br>
        <button type="submit" class="btn btn-primary w-100">Submit Complaint</button>
    </form>
</div>
{% endblock %}
