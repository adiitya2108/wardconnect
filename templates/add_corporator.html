{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 500px; margin: auto;">
    <h2 class="text-center">Add Corporator</h2>
    <form method="POST" action="/add_corporator">
        Full Name: <input type="text" name="full_name" class="form-control" required><br>
        Email: <input type="email" name="email" class="form-control" required><br>
        Password: <input type="password" name="password" class="form-control" required><br>
        Mobile: <input type="text" name="mobile" class="form-control"><br>
        Ward ID: <input type="text" name="ward_id" class="form-control" placeholder="W05" required><br>
        <button type="submit" class="btn btn-primary w-100">Add Corporator</button>
    </form>
    <p class="text-center mt-3"><a href="/admin_dashboard">Back to Dashboard</a></p>
</div>
{% endblock %}
