{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Corporator Dashboard</h2>
    <table class="table table-striped">
        <tr><th>ID</th><th>Title</th><th>Category</th><th>Status</th><th>Action</th></tr>
        {% for c in complaints %}
        <tr>
            <td>{{ c[0] }}</td>
            <td>{{ c[1] }}</td>
            <td>{{ c[2] }}</td>
            <td><span class="status-badge">{{ c[3] }}</span></td>
            <td><a href="/update_status/{{ c[0] }}" class="btn btn-primary btn-sm">Update Status</a></td>
        </tr>
        {% endfor %}
    </table>
</div>
{% endblock %}
